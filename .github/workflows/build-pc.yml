name: Build & Push PC + Web

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier une Release GitHub avec les exécutables PC (nécessite un tag ou crée v1.0.x)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Vérification TypeScript & Compilation Web (Vite)
  # ---------------------------------------------------------------------------
  build-web:
    name: Web Bundle & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install

      - name: TypeScript check (lint)
        run: npm run lint

      - name: Build production web bundle
        run: npm run build

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamebuino-AKA-Pinball-Web
          path: dist/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ---------------------------------------------------------------------------
  # 2. Déploiement automatique GitHub Pages (si Pages est activé sur le dépôt)
  # ---------------------------------------------------------------------------
  deploy-web-pages:
    name: Deploy Web (GitHub Pages)
    needs: build-web
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 3. Compilation des exécutables PC autonomes (Windows, Linux, macOS)
  # ---------------------------------------------------------------------------
  build-pc:
    name: Build PC (${{ matrix.label }})
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            script: dist:win
            artifact: Gamebuino-AKA-Pinball-PC-Windows
          - os: ubuntu-latest
            label: Linux-x64
            script: dist:linux
            artifact: Gamebuino-AKA-Pinball-PC-Linux
          - os: macos-latest
            label: macOS-Universal
            script: dist:mac
            artifact: Gamebuino-AKA-Pinball-PC-macOS

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download compiled Web bundle
        uses: actions/download-artifact@v4
        with:
          name: Gamebuino-AKA-Pinball-Web
          path: dist

      - name: Sync Web bundle into Desktop wrapper
        run: node desktop/scripts/sync-web.mjs

      - name: Install Electron builder dependencies
        working-directory: desktop
        run: npm install

      - name: Package standalone PC executable (${{ matrix.label }})
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: Upload PC executable artifact (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 60

  # ---------------------------------------------------------------------------
  # 4. Publication automatique sur GitHub Releases lors d'un tag v*
  # ---------------------------------------------------------------------------
  release-pc:
    name: Publish PC Executables to GitHub Release
    needs: build-pc
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Download all PC artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Gamebuino-AKA-Pinball-PC-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Gamebuino AKA Pinball ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          files: |
            release-assets/*
