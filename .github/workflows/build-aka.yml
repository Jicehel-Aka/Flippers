name: Build Gamebuino AKA Firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'firmware/**'
      - 'scripts/gen-aka-tables.mjs'
      - 'src/data/tables.ts'
      - '.github/workflows/build-aka.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'scripts/gen-aka-tables.mjs'
      - 'src/data/tables.ts'
      - '.github/workflows/build-aka.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Joindre le paquet carte SD à une Release GitHub'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag de la Release (ex. v1.1.0). Le donner IDENTIQUE aux deux workflows (PC et AKA) pour une seule Release. Vide = v1.0.<n° d exécution>'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Plateaux à jour avec src/data/tables.ts + test PC du coeur de jeu et du rendu
  # ---------------------------------------------------------------------------
  tables-and-host:
    name: Plateaux générés & test PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: tables_data.inc à jour avec tables.ts
        run: node scripts/gen-aka-tables.mjs --check

      - name: Test hôte (physique, états, sons, rendu) avec g++
        run: bash firmware/aka_idf/test/host/run.sh

  # ---------------------------------------------------------------------------
  # 2. Compilation ESP-IDF 5.5.1 (ESP32-S3) + dossier carte SD du loader AKA
  # ---------------------------------------------------------------------------
  firmware:
    name: Firmware ESP32-S3 (ESP-IDF 5.5.1)
    needs: tables-and-host
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: idf.py build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/aka_idf
          idf.py build

      - name: Mémoire
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/aka_idf
          idf.py size | tail -25

      - name: Préparer le dossier carte SD
        shell: bash
        run: |
          set -e
          cd firmware/aka_idf
          BIN=build/aka_pinball.bin
          test -f "$BIN"
          rm -rf dist && mkdir -p dist/pinball dist/AKA
          cp -r sdcard_files/pinball/. dist/pinball/
          cp -r sdcard_files/AKA/. dist/AKA/
          cp "$BIN" dist/pinball/firmware.bin
          python3 - <<'PY'
          import json, datetime
          p = "dist/pinball/meta.json"
          m = json.load(open(p, encoding="utf-8"))
          m["date"] = datetime.date.today().isoformat()
          json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open(p, "a").write("\n")
          PY
          cat > dist/LISEZMOI.txt <<'TXT'
          AKA PINBALL - INSTALLATION
          ==========================
          1. Copiez les dossiers "pinball" et "AKA" a la racine de la carte SD de la Gamebuino AKA.
             ("AKA" est commun a tous les jeux : ne remplacez pas une version plus recente.)
          2. Lancez le jeu depuis le loader. Tournez la console de 90 degres vers la droite.

          COMMANDES
            A / L1 / Gauche   flippers gauches
            D / Droite        flippers droits
            R1 / Bas          ressort (maintenir, relacher pour tirer)
            B / Haut          secousse (attention au TILT)
            (pas de touche de pause : MENU met le jeu en pause)
            MENU              menu systeme du loader (commandes, langue, retour au loader)
          TXT
          mkdir -p ../../out
          (cd dist && zip -r ../../../out/AKA-Pinball-sdcard.zip pinball AKA LISEZMOI.txt)
          cp "$BIN" ../../out/AKA-Pinball-firmware.bin
          ls -l ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: Gamebuino-AKA-Pinball
          path: out/*
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 3. Publication sur GitHub Releases (tag v* ou déclenchement manuel)
  # ---------------------------------------------------------------------------
  release-aka-firmware:
    name: Publier le firmware AKA
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    # Même groupe que la release PC (voir build-pc.yml) : publications sérialisées.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gamebuino-AKA-Pinball
          path: aka-release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v1.0.{0}', github.run_number)) }}
          name: Gamebuino AKA Pinball ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v1.0.{0}', github.run_number)) }}
          generate_release_notes: true
          files: |
            aka-release/AKA-Pinball-sdcard.zip
            aka-release/AKA-Pinball-firmware.bin
