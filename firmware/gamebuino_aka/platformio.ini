; ============================================================================
; Gamebuino AKA Pinball - Configuration PlatformIO (ESP32)
; Orientation : Console tournée à 90° vers la droite -> Écran 240x320 portrait
; Plateau     : 240x520 px (4 architectures uniques, Multibille x3, Missions)
; ============================================================================

[platformio]
default_envs = gamebuino_aka

[env:gamebuino_aka]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = default.csv

lib_deps =
  lovyan03/LovyanGFX @ ^1.1.0

build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DCORE_DEBUG_LEVEL=0
  -DAKA_SCREEN_W=240
  -DAKA_SCREEN_H=320

extra_scripts =
  post:scripts/export_aka_bin.py

; Optionnel : profil utilisant directement la librairie communautaire Gamebuino_AKA_lib
[env:gamebuino_aka_sdk]
extends = env:gamebuino_aka
lib_deps =
  lovyan03/LovyanGFX @ ^1.1.0
  https://github.com/jmp42/Gamebuino_AKA_lib.git
build_flags =
  ${env:gamebuino_aka.build_flags}
  -DHAS_EXTERNAL_AKA_SDK=1
